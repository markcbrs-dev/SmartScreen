<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SMARTSCREEN — HR Login</title>
  <style>
    :root{ --blue:#1e73d8; --muted:#6b7280; --card-bg:#ffffff; --page-bg:#f3f6fb; --radius:12px; --max-width:420px; --gap:14px; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    html,body{ height:100%; margin:0; background:var(--page-bg); color:#111827; }
    .header{ background:var(--blue); color:white; padding:18px 20px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 6px rgba(16,24,40,0.08); }
    .logo{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
    .brand{ font-weight:700; font-size:18px; letter-spacing:1px; }
    .wrap{ min-height:calc(100vh - 80px); display:flex; align-items:center; justify-content:center; padding:36px 16px; }
    .card{ width:100%; max-width:var(--max-width); background:var(--card-bg); border-radius:var(--radius); padding:22px; box-shadow:0 6px 20px rgba(16,24,40,0.08); border:1px solid rgba(15,23,42,0.04); }
    h2{ margin:0 0 12px; font-size:22px; color:#0f172a; }
    .subtext{ margin:0 0 18px; color:var(--muted); font-size:14px; }
    .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:var(--gap); }
    label{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:0.6px; }
    input[type="text"], input[type="password"]{ padding:10px 12px; border-radius:8px; border:1px solid rgba(15,23,42,0.06); font-size:14px; outline:none; }
    input:focus{ border-color:rgba(30,115,216,0.9); box-shadow:0 4px 12px rgba(30,115,216,0.08); }
    .remember-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; color:#374151; font-size:14px; }
    .remember-row input{ accent-color:#0b5ec7; }
    .alert{ border-radius:8px; padding:10px 12px; margin-bottom:14px; font-size:14px; }
    .alert-success{ background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
    .alert-warning{ background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    .alert-info{ background:#dbeafe; color:#1d4ed8; border:1px solid #bfdbfe; }
    .alert-danger{ background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
    .submit{ margin-top:8px; width:100%; padding:10px 12px; border-radius:8px; border:none; background:#0b5ec7; color:white; font-weight:700; cursor:pointer; }
    .footer-link{ margin-top:16px; text-align:center; font-size:14px; }
    .footer-link .submit{ margin-top:0; }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <div class="logo" aria-hidden="true">S</div>
    <div class="brand">SMARTSCREEN</div>
  </header>

  <main class="wrap" role="main">
    <form class="card" method="post" action="{% url 'login' %}" novalidate>
      {% csrf_token %}
      <h2>HR Login</h2>
      <p class="subtext">Sign in to access the SmartScreen dashboard.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      {% if form.errors %}
        <div class="alert alert-danger">Please correct the errors below.</div>
      {% endif %}

      <div class="field">
        <label for="id_username">USERNAME</label>
        <input type="text" name="username" id="id_username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="id_password">PASSWORD</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>

      <div class="remember-row">
        <input type="checkbox" name="remember" id="id_remember">
        <label for="id_remember">Remember me</label>
      </div>

      <button type="submit" class="submit">Sign in</button>

      <div class="footer-link">
        <button type="button" class="submit" onclick="window.location.href='{% url 'hr_register' %}'">Register</button>
      </div>
    </form>
  </main>
</body>
</html>
